[package]
name = "ressu_core"
version = "0.1.0"
edition = "2021"
authors = ["Phaethon"]
description = "Core emulator engine for RessuRetro J2ME emulator"
license = "Apache-2.0"

[lib]
name = "ressu_core"
crate-type = ["rlib", "cdylib"]

[dependencies]
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
byteorder = "1.5"
flutter_rust_bridge = "=2.0.0"

